<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みんなの在庫帳</title>
<meta name="description" content="グループで同じ在庫をリアルタイムに管理する在庫帳">
<meta name="theme-color" content="#1f5a85">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="在庫帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one column ledger — summary strip, toolbar, item rows with big +/- steppers, name setting at the end */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --sunk: #e3e9e7;
  --ink: #16211e;
  --muted: #5b6a66;
  --line: #d3dcd9;
  --accent: #1f5a85;
  --accent-ink: #ffffff;
  --ok: #2c7a4b;
  --warn: #a8670f;
  --warn-bg: #fbf1df;
  --bad: #b8400e;
  --bad-bg: #fbe6dc;
  --c-in: #2f6fa8;
  --c-out: #c8761a;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111816; --surface: #19221f; --sunk: #222d2a; --ink: #e6eeeb; --muted: #97a7a2;
    --line: #2e3b37; --accent: #6fb0e0; --accent-ink: #0d1a24; --ok: #63c58a; --warn: #e3a648;
    --warn-bg: #3a2c14; --bad: #f08a5d; --bad-bg: #3d2117; --c-in: #3f8ed8; --c-out: #c4802a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111816; --surface: #19221f; --sunk: #222d2a; --ink: #e6eeeb; --muted: #97a7a2;
  --line: #2e3b37; --accent: #6fb0e0; --accent-ink: #0d1a24; --ok: #63c58a; --warn: #e3a648;
  --warn-bg: #3a2c14; --bad: #f08a5d; --bad-bg: #3d2117; --c-in: #3f8ed8; --c-out: #c4802a; color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  -webkit-text-size-adjust: 100%;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.6rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.sub { color: var(--muted); font-size: .85rem; margin: 2px 0 0; }
.conn { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--ok); }
.dot.err { background: var(--bad); }

.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
}
.tile[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: -2px; }
.tile .k { font-size: .75rem; color: var(--muted); letter-spacing: .04em; }
.tile .v { font-family: var(--font-num); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile.warn .v { color: var(--warn); }
.tile.bad .v { color: var(--bad); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar input, .toolbar select { flex: 1 1 160px; min-width: 0; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 11px; width: 100%;
}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
button { font: inherit; cursor: pointer; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px;
  padding: 9px 14px; font-weight: 500; white-space: nowrap;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row {
  display: grid; grid-template-columns: 6px 1fr auto; gap: 0 12px; align-items: center;
  padding: 16px 12px 16px 0; border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.stripe { align-self: stretch; background: var(--ok); }
.row.low .stripe { background: var(--warn); }
.row.out .stripe { background: var(--bad); }
.info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.name { font-weight: 700; font-size: 1.3rem; line-height: 1.35; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; overflow-wrap: anywhere; }
.pill { font-size: .8rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; letter-spacing: .04em; }
.pill.low { background: var(--warn-bg); color: var(--warn); }
.pill.out { background: var(--bad-bg); color: var(--bad); }
.meta { font-size: .92rem; color: var(--muted); overflow-wrap: anywhere; }
.meta .edit { background: none; border: 0; padding: 2px 0; color: var(--accent); text-decoration: underline; font-size: .92rem; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button {
  width: 46px; height: 46px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk);
  color: var(--ink); font-size: 1.5rem; font-weight: 700; line-height: 1;
}
.qty { min-width: 76px; text-align: center; }
.qty b { font-family: var(--font-num); font-size: 1.8rem; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
.qty span { font-size: .88rem; color: var(--muted); }
.qtyIn {
  width: 84px; padding: 4px 4px; text-align: center; font-family: var(--font-num); font-size: 1.8rem; font-weight: 700;
  font-variant-numeric: tabular-nums; line-height: 1.1; border: 1px dashed var(--line); background: var(--surface); border-radius: 8px;
}
.qtyIn:hover { border-color: var(--accent); }
.qtyIn:focus { border-style: solid; border-color: var(--accent); }
.row.out .qtyIn { color: var(--bad); }
.row.low .qtyIn { color: var(--warn); }
.row.out .qty b { color: var(--bad); }
.row.low .qty b { color: var(--warn); }

.empty { padding: 32px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty strong { color: var(--ink); font-size: 1.05rem; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 1.05rem; margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); min-width: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.actions .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--ink); padding: 7px 12px; font-size: .85rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.note { font-size: .8rem; color: var(--muted); margin: 0; }
.banner { font-size: .85rem; padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .88rem;
  max-width: calc(100% - 32px); z-index: 20;
}
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button {
  background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px;
  padding: 8px 14px; font-size: 1rem; font-weight: 700; color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.view { display: flex; flex-direction: column; gap: 18px; }
.hctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hctl select { flex: 1 1 180px; width: auto; min-width: 0; }
.hsum { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.hsum .tile { cursor: default; }
.hsum .tile .v { font-variant-numeric: normal; }
.hsum .tile .u { font-size: .8rem; color: var(--muted); margin-left: 2px; font-family: var(--font-body); font-weight: 500; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.chart { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.chart text.lbl { fill: var(--ink); font-weight: 700; font-size: 12px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.chart .b-in { fill: var(--c-in); }
.chart .b-out { fill: var(--c-out); }
.chart .hl { fill: var(--sunk); }
.chart .ln { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .1; }
.chart .dotm { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .ref { stroke: var(--warn); stroke-width: 1; }
.tip {
  position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg);
  font-size: .82rem; line-height: 1.55; padding: 6px 10px; border-radius: 8px; white-space: nowrap; z-index: 5;
}
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { padding: 9px 10px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 8em; }
[hidden] { display: none !important; }
thead th { border-top: 0; font-size: .8rem; color: var(--muted); font-weight: 500; }
td .unit { color: var(--muted); font-size: .8rem; margin-left: 2px; }
.muted { color: var(--muted); }
@media (max-width: 460px) {
  .tile .v { font-size: 1.3rem; }
  .name { font-size: 1.18rem; }
  .meta, .meta .edit { font-size: .86rem; }
  .stepper button { width: 40px; height: 40px; }
  .qty { min-width: 64px; }
  .qtyIn { width: 68px; font-size: 1.5rem; }
  .qty b { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .row { transition: background-color .2s; }
}
.me { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.me input { flex: 1 1 160px; width: auto; min-width: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>みんなの在庫帳</h1>
      <p class="sub">グループで同じ在庫を見て、増減をその場で記録</p>
    </div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connText">接続中…</span></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <nav class="tabs" role="tablist" aria-label="画面の切り替え">
    <button role="tab" id="tabList" aria-selected="true" aria-controls="viewList">在庫一覧</button>
    <button role="tab" id="tabHist" aria-selected="false" aria-controls="viewHist">増減の記録</button>
  </nav>

  <section id="viewHist" class="view" role="tabpanel" aria-labelledby="tabHist" hidden>
    <div class="hctl">
      <div class="seg" role="group" aria-label="期間" id="hDays">
        <button data-days="7" aria-pressed="false">7日</button>
        <button data-days="30" aria-pressed="true">30日</button>
        <button data-days="90" aria-pressed="false">90日</button>
      </div>
      <select id="hItem" aria-label="品目"><option value="">すべての品目</option></select>
    </div>
    <div class="hsum" id="hSum"></div>
    <section class="panel">
      <h2 id="hBarsTitle">日ごとの増減</h2>
      <div class="legend"><span><i style="background: var(--c-in)"></i>増えた（入荷・補充）</span><span><i style="background: var(--c-out)"></i>減った（使用・出荷）</span></div>
      <div class="chart" id="hBars"></div>
    </section>
    <section class="panel" id="hLinePanel" hidden>
      <h2>在庫数の推移</h2>
      <div class="chart" id="hLine"></div>
    </section>
    <section class="panel">
      <h2 id="hTblTitle">品目ごとの増減</h2>
      <div class="tbl-wrap" id="hTbl"></div>
    </section>
  </section>

  <div id="viewList" class="view" role="tabpanel" aria-labelledby="tabList">
  <section class="summary" aria-label="在庫の概要">
    <button class="tile" data-filter="all" aria-pressed="true"><span class="k">品目</span><span class="v" id="sumAll">–</span></button>
    <button class="tile warn" data-filter="low" aria-pressed="false"><span class="k">残りわずか</span><span class="v" id="sumLow">–</span></button>
    <button class="tile bad" data-filter="out" aria-pressed="false"><span class="k">在庫切れ</span><span class="v" id="sumOut">–</span></button>
  </section>

  <div class="toolbar">
    <input id="q" type="search" placeholder="品名・場所で検索" aria-label="検索">
    <select id="cat" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option></select>
    <button class="btn primary" id="addBtn">＋ 品目を追加</button>
  </div>

  <section class="panel" id="form" hidden aria-labelledby="formTitle">
    <h2 id="formTitle">品目を追加</h2>
    <div class="grid2">
      <label>品名 *<input id="fName" required maxlength="60" placeholder="例：トイレットペーパー"></label>
      <label>カテゴリ<input id="fCat" maxlength="30" list="catList" placeholder="例：日用品"></label>
      <label>数量<input id="fQty" type="number" inputmode="decimal" min="0" step="1" value="0"></label>
      <label>単位<input id="fUnit" maxlength="10" placeholder="個・箱・本 など" value="個"></label>
      <label>この数以下で「残りわずか」<input id="fMin" type="number" inputmode="decimal" min="0" step="1" value="1"></label>
      <label>保管場所<input id="fPlace" maxlength="40" placeholder="例：倉庫 棚B"></label>
    </div>
    <label>メモ<textarea id="fNote" rows="2" maxlength="200" placeholder="発注先・型番など"></textarea></label>
    <datalist id="catList"></datalist>
    <div class="actions">
      <button class="btn danger" id="delBtn" hidden>削除</button>
      <span class="spacer"></span>
      <button class="btn" id="cancelBtn">キャンセル</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
  </section>

  <section class="list" id="list" aria-live="polite">
    <div class="empty"><strong>在庫を読み込んでいます…</strong></div>
  </section>

  <section class="panel" aria-labelledby="meTitle">
    <h2 id="meTitle">あなたの名前</h2>
    <div class="me">
      <input id="meName" maxlength="20" placeholder="例：田中" autocomplete="nickname" aria-label="あなたの名前">
      <button class="btn" id="meSave">保存</button>
    </div>
    <p class="note">数を変えた人として、品目の「更新」の横に表示されます。この端末だけに保存されます。</p>
  </section>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = {
    items: [], filter: "all", q: "", cat: "",
    db: null, me: null, myName: "", canWrite: true, editing: null,
    pending: new Map(), timers: new Map(), writing: new Set(),
    view: "list", hist: [], histMine: new Map(), histChain: new Map(), hDays: 30, hItem: "",
  };

  // ---------- helpers ----------
  const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
  const statusOf = (it) => {
    const q = qtyOf(it);
    if (q <= 0) return "out";
    if (q <= num(it.min, 0)) return "low";
    return "ok";
  };
  const qtyOf = (it) => state.pending.has(it.id) ? state.pending.get(it.id) : num(it.qty);
  const fmtTime = (ms) => {
    if (!ms) return "";
    const d = new Date(ms), now = new Date();
    const hm = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
    if (d.toDateString() === now.toDateString()) return "今日 " + hm;
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
  };
  let toastTimer;
  const toast = (msg) => {
    const t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  };
  const setConn = (kind, text) => {
    $("connDot").className = "dot" + (kind ? " " + kind : "");
    $("connText").textContent = text;
  };
  const banner = (msg) => { const b = $("banner"); b.textContent = msg || ""; b.hidden = !msg; };
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null) n.setAttribute(k, v);
    }
    for (const c of kids) if (c != null) n.append(c);
    return n;
  };

  // ---------- render ----------
  function render() {
    const items = state.items;
    const low = items.filter((i) => statusOf(i) === "low").length;
    const out = items.filter((i) => statusOf(i) === "out").length;
    $("sumAll").textContent = items.length;
    $("sumLow").textContent = low;
    $("sumOut").textContent = out;
    document.querySelectorAll(".tile").forEach((t) => t.setAttribute("aria-pressed", String(t.dataset.filter === state.filter)));

    // categories
    const cats = [...new Set(items.map((i) => (i.category || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ja"));
    const sel = $("cat"); const cur = state.cat;
    sel.replaceChildren(el("option", { value: "" }, "すべてのカテゴリ"), ...cats.map((c) => el("option", { value: c }, c)));
    sel.value = cats.includes(cur) ? cur : "";
    $("catList").replaceChildren(...cats.map((c) => el("option", { value: c })));

    // rows
    const q = state.q.trim().toLowerCase();
    const shown = items
      .filter((i) => state.filter === "all" || (state.filter === "low" ? statusOf(i) !== "ok" : statusOf(i) === "out"))
      .filter((i) => !state.cat || (i.category || "") === state.cat)
      .filter((i) => !q || [i.name, i.place, i.category, i.note].join(" ").toLowerCase().includes(q))
      .sort((a, b) => {
        const rank = { out: 0, low: 1, ok: 2 };
        return rank[statusOf(a)] - rank[statusOf(b)] || String(a.name).localeCompare(String(b.name), "ja");
      });

    const list = $("list");
    if (!state.loaded) return;
    if (!items.length) {
      list.replaceChildren(el("div", { class: "empty" },
        el("strong", {}, "まだ品目がありません"),
        el("span", {}, "「＋ 品目を追加」から最初の在庫を登録してください。グループの誰が追加しても、全員の画面にすぐ反映されます。"),
        state.canWrite ? el("button", { class: "btn", onclick: loadSamples }, "サンプルを入れて試す") : null,
      ));
    } else if (!shown.length) {
      list.replaceChildren(el("div", { class: "empty" }, el("strong", {}, "条件に合う品目はありません")));
    } else {
      const a = document.activeElement;
      const keep = a && a.classList && a.classList.contains("qtyIn")
        ? { id: a.dataset.id, value: a.value, s: a.selectionStart, e: a.selectionEnd } : null;
      list.replaceChildren(...shown.map(rowFor));
      if (keep) {
        const n = list.querySelector('.qtyIn[data-id="' + CSS.escape(keep.id) + '"]');
        if (n) { n.value = keep.value; n.focus({ preventScroll: true }); try { n.setSelectionRange(keep.s, keep.e); } catch {} }
      }
    }
  }

  function rowFor(it) {
    const st = statusOf(it);
    const qty = qtyOf(it);
    const who = it.updatedByName || "";
    const metaBits = [it.category, it.place && "📍" + it.place].filter(Boolean).join("・");
    const updated = it.updatedAt ? "更新 " + fmtTime(it.updatedAt) + (who ? "（" + who + "）" : "") : "";
    return el("div", { class: "row " + st },
      el("div", { class: "stripe", "aria-hidden": "true" }),
      el("div", { class: "info" },
        el("div", { class: "name" }, it.name || "（名称なし）",
          st === "out" ? el("span", { class: "pill out" }, "在庫切れ") : st === "low" ? el("span", { class: "pill low" }, "残りわずか") : null),
        el("div", { class: "meta" }, [metaBits, updated].filter(Boolean).join("　")),
        it.note ? el("div", { class: "meta" }, it.note) : null,
        state.canWrite ? el("div", { class: "meta" }, el("button", { class: "edit", onclick: () => openForm(it) }, "編集")) : null,
      ),
      el("div", { class: "stepper" },
        state.canWrite ? el("button", { "aria-label": it.name + "を1減らす", onclick: () => bump(it, -1), disabled: qty <= 0 ? "" : null }, "−") : null,
        el("div", { class: "qty" },
          state.canWrite
            ? el("input", {
                class: "qtyIn", type: "text", inputmode: "numeric", pattern: "[0-9]*", enterkeyhint: "done",
                autocomplete: "off", "data-id": it.id, value: String(qty), "aria-label": it.name + "の数量（タップして入力）",
                onfocus: (e) => e.target.select(),
                onkeydown: (e) => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") { e.target.value = String(qtyOf(it)); e.target.blur(); } },
                onblur: (e) => commitQty(it, e.target),
              })
            : el("b", {}, String(qty)),
          el("span", {}, it.unit || "")),
        state.canWrite ? el("button", { "aria-label": it.name + "を1増やす", onclick: () => bump(it, 1) }, "＋") : null,
      ),
    );
  }

  // ---------- writes ----------
  // Firestore applies writes locally at once and syncs later; don't block the UI while offline.
  const w = (p) => Promise.race([p, new Promise((r) => setTimeout(r, 1500))]).then((v) => { p.catch(writeFailed); return v; });
  function stamp() { return { updatedAt: Date.now(), updatedBy: state.me || null, updatedByName: state.myName || "" }; }
  function writeFailed(e) {
    if (e && e.code === "permission-denied") toast("保存できませんでした。入力内容（文字数や数値）を確認してください");
    else if (e && e.code === "resource-exhausted") toast("無料枠の上限に達したため、しばらく保存できません");
    else toast("保存できませんでした。通信状況を確認してもう一度お試しください");
  }

  function bump(it, delta) {
    if (!state.db) return;
    const next = Math.max(0, qtyOf(it) + delta);
    state.pending.set(it.id, next);
    render();
    clearTimeout(state.timers.get(it.id));
    state.timers.set(it.id, setTimeout(() => flushQty(it.id), 700));
  }
  function commitQty(it, input) {
    const raw = input.value.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, "");
    const cur = qtyOf(it);
    if (raw === "") { input.value = String(cur); return; }
    const next = Math.max(0, parseInt(raw, 10));
    if (next === cur) { input.value = String(cur); return; }
    state.pending.set(it.id, next);
    clearTimeout(state.timers.get(it.id));
    flushQty(it.id);
    toast("「" + it.name + "」を " + next + (it.unit || "") + " にしました");
    render();
  }
  async function flushQty(id) {
    if (state.writing.has(id)) { state.timers.set(id, setTimeout(() => flushQty(id), 300)); return; }
    if (!state.pending.has(id)) return;
    const qty = state.pending.get(id);
    const item = state.items.find((i) => i.id === id);
    const old = item ? num(item.qty) : null;
    state.writing.add(id);
    try {
      await w(state.db.collection("items").doc(id).update({ qty, ...stamp() }));
      if (item) logChange(item, old, qty);
      if (state.pending.get(id) === qty) state.pending.delete(id);
    } catch (e) {
      state.pending.delete(id);
      writeFailed(e);
    } finally {
      state.writing.delete(id);
      render();
    }
  }

  function openForm(it) {
    state.editing = it || null;
    $("formTitle").textContent = it ? "「" + it.name + "」を編集" : "品目を追加";
    $("fName").value = it ? it.name || "" : "";
    $("fCat").value = it ? it.category || "" : (state.cat || "");
    $("fQty").value = it ? qtyOf(it) : 0;
    $("fUnit").value = it ? it.unit || "" : "個";
    $("fMin").value = it ? num(it.min, 0) : 1;
    $("fPlace").value = it ? it.place || "" : "";
    $("fNote").value = it ? it.note || "" : "";
    $("delBtn").hidden = !it;
    $("delBtn").textContent = "削除";
    delete $("delBtn").dataset.armed;
    $("form").hidden = false;
    $("form").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    $("fName").focus({ preventScroll: true });
  }
  function closeForm() { $("form").hidden = true; state.editing = null; }

  async function save() {
    const name = $("fName").value.trim();
    if (!name) { toast("品名を入力してください"); $("fName").focus(); return; }
    const body = {
      name,
      category: $("fCat").value.trim(),
      qty: Math.max(0, num($("fQty").value)),
      unit: $("fUnit").value.trim(),
      min: Math.max(0, num($("fMin").value)),
      place: $("fPlace").value.trim(),
      note: $("fNote").value.trim(),
      ...stamp(),
    };
    $("saveBtn").disabled = true;
    try {
      const col = state.db.collection("items");
      if (state.editing) {
        const ed = state.editing;
        const old = num(ed.qty);
        state.pending.delete(ed.id);
        await w(col.doc(ed.id).set({ ...body, createdAt: ed.createdAt || body.updatedAt }));
        logChange({ id: ed.id, name, unit: body.unit }, old, body.qty);
        toast("「" + name + "」を更新しました");
      } else {
        const ref = col.doc();
        await w(ref.set({ ...body, createdAt: body.updatedAt }));
        logChange({ id: ref.id, name, unit: body.unit }, 0, body.qty);
        toast("「" + name + "」を追加しました");
      }
      closeForm();
    } catch (e) { writeFailed(e); }
    finally { $("saveBtn").disabled = false; }
  }

  // ---------- history (daily totals per item per person) ----------
  const dk = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const dLabel = (k, wd) => { const [y, m, d] = k.split("-").map(Number); const t = new Date(y, m - 1, d); return m + "/" + d + (wd ? "（" + WD[t.getDay()] + "）" : ""); };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function logChange(item, oldQ, newQ) {
    const delta = num(newQ) - num(oldQ);
    if (!delta || !state.db || !item || !item.id) return;
    const date = dk(new Date());
    const id = date + "_" + item.id + "_" + (state.me || "anon");
    const mine = state.histMine.get(id);
    const h = state.hist.find((x) => x.id === id);
    let cur = mine && (!h || mine.at >= num(h.at)) ? mine : h ? { inc: num(h.inc), dec: num(h.dec) } : { inc: 0, dec: 0 };
    const at = Date.now();
    cur = { inc: cur.inc + Math.max(0, delta), dec: cur.dec + Math.max(0, -delta), at };
    state.histMine.set(id, cur);
    const body = { date, itemId: item.id, name: item.name || "", unit: item.unit || "", inc: cur.inc, dec: cur.dec, endQty: num(newQ), at, by: state.me || null };
    const prev = state.histChain.get(id) || Promise.resolve();
    state.histChain.set(id, prev.then(() => state.db.collection("history").doc(id).set(body)).catch(() => {}));
  }

  function niceStep(max, count) {
    if (max <= 0) return 1;
    const raw = max / count, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    return Math.max(1, (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p);
  }
  function xLabels(keys, ml, band) {
    const n = keys.length, every = Math.max(1, Math.ceil(n / 6));
    let s = "";
    for (let i = n - 1; i >= 0; i -= every) {
      const anchor = i === n - 1 && n > 1 ? "end" : "middle";
      const x = anchor === "end" ? ml + n * band : ml + (i + 0.5) * band;
      s += '<text x="' + x + '" y="__Y__" text-anchor="' + anchor + '">' + dLabel(keys[i]) + "</text>";
    }
    return s;
  }
  function attachHover(wrap, svg, W, ml, band, n, tipHtml) {
    const tip = el("div", { class: "tip", hidden: "" });
    wrap.append(tip);
    const hl = svg.querySelector(".hl");
    const show = (ev) => {
      const r = svg.getBoundingClientRect();
      const sx = (ev.clientX - r.left) * (W / r.width);
      const i = Math.floor((sx - ml) / band);
      if (i < 0 || i >= n) { hide(); return; }
      if (hl) { hl.setAttribute("x", ml + i * band); hl.setAttribute("width", band); hl.removeAttribute("visibility"); }
      tip.innerHTML = tipHtml(i);
      tip.hidden = false;
      const cx = (ml + (i + 0.5) * band) * (r.width / W);
      const tw = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(wrap.clientWidth - tw, cx - tw / 2)) + "px";
      tip.style.top = (-tip.offsetHeight - 6) + "px";
    };
    const hide = () => { tip.hidden = true; if (hl) hl.setAttribute("visibility", "hidden"); };
    svg.addEventListener("pointermove", show);
    svg.addEventListener("pointerdown", show);
    svg.addEventListener("pointerleave", hide);
  }

  function drawBars(wrap, keys, days, unit, single) {
    const W = Math.max(300, Math.round(wrap.clientWidth || 600)), H = 220, ml = 44, mr = 6, mt = 10, mb = 26;
    const n = keys.length, pw = W - ml - mr, ph = H - mt - mb, band = pw / n;
    const maxI = Math.max(0, ...days.map((d) => d.inc)), maxD = Math.max(0, ...days.map((d) => d.dec));
    const step = niceStep(Math.max(maxI, maxD, 1), 3);
    const top = Math.max(step, Math.ceil(maxI / step) * step), bot = Math.ceil(maxD / step) * step;
    const y = (v) => mt + ((top - v) / (top + bot)) * ph;
    const y0 = y(0);
    let s = '<rect class="hl" x="0" y="' + mt + '" width="0" height="' + ph + '" visibility="hidden"></rect>';
    for (let v = -bot; v <= top + 1e-9; v += step) {
      const yy = y(v).toFixed(1);
      if (v !== 0) s += '<line class="grid" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + yy + '" y2="' + yy + '"></line>';
      s += '<text x="' + (ml - 6) + '" y="' + yy + '" dy="4" text-anchor="end">' + (v > 0 ? "+" + v : v < 0 ? "−" + -v : "0") + "</text>";
    }
    const bw = Math.min(24, Math.max(1, band - 2));
    days.forEach((d, i) => {
      const x = ml + i * band + (band - bw) / 2;
      if (d.inc > 0) {
        const yt = y(d.inc), r = Math.min(bw >= 8 ? 4 : 0, bw / 2, y0 - yt);
        s += '<path class="b-in" d="M' + x + "," + y0 + "V" + (yt + r) + "Q" + x + "," + yt + " " + (x + r) + "," + yt + "H" + (x + bw - r) + "Q" + (x + bw) + "," + yt + " " + (x + bw) + "," + (yt + r) + "V" + y0 + 'Z"></path>';
      }
      if (d.dec > 0) {
        const yb = y(-d.dec), r = Math.min(bw >= 8 ? 4 : 0, bw / 2, yb - y0);
        s += '<path class="b-out" d="M' + x + "," + y0 + "V" + (yb - r) + "Q" + x + "," + yb + " " + (x + r) + "," + yb + "H" + (x + bw - r) + "Q" + (x + bw) + "," + yb + " " + (x + bw) + "," + (yb - r) + "V" + y0 + 'Z"></path>';
      }
    });
    s += '<line class="zero" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + y0 + '" y2="' + y0 + '"></line>';
    s += xLabels(keys, ml, band).replaceAll("__Y__", H - 6);
    wrap.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="日ごとの増減のグラフ。詳しい数字は下の表にあります">' + s + "</svg>";
    const u = unit ? esc(unit) : "";
    attachHover(wrap, wrap.querySelector("svg"), W, ml, band, n, (i) => {
      const d = days[i];
      return "<b>" + dLabel(keys[i], true) + "</b><br>" +
        '<i style="background: var(--c-in)"></i>増えた +' + d.inc + u + "<br>" +
        '<i style="background: var(--c-out)"></i>減った −' + d.dec + u +
        (single && d.end != null ? "<br>その日の終わり " + d.end + u : "");
    });
  }

  function drawLine(wrap, keys, vals, min, unit) {
    const W = Math.max(300, Math.round(wrap.clientWidth || 600)), H = 200, ml = 44, mr = 40, mt = 14, mb = 26;
    const n = keys.length, pw = W - ml - mr, ph = H - mt - mb, band = pw / n;
    const known = vals.filter((v) => v != null);
    const step = niceStep(Math.max(1, ...known, min), 3);
    const top = Math.max(step, Math.ceil(Math.max(1, ...known, min) / step) * step);
    const y = (v) => mt + ((top - v) / top) * ph;
    const cx = (i) => ml + (i + 0.5) * band;
    let s = '<rect class="hl" x="0" y="' + mt + '" width="0" height="' + ph + '" visibility="hidden"></rect>';
    for (let v = 0; v <= top + 1e-9; v += step) {
      const yy = y(v).toFixed(1);
      s += '<line class="' + (v === 0 ? "zero" : "grid") + '" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + yy + '" y2="' + yy + '"></line>';
      s += '<text x="' + (ml - 6) + '" y="' + yy + '" dy="4" text-anchor="end">' + v + "</text>";
    }
    if (min > 0) {
      const yy = y(min).toFixed(1);
      s += '<line class="ref" x1="' + ml + '" x2="' + (W - mr) + '" y1="' + yy + '" y2="' + yy + '"></line>';
      s += '<text x="' + (ml + 4) + '" y="' + yy + '" dy="-4">目安 ' + min + "</text>";
    }
    const pts = vals.map((v, i) => (v == null ? null : [cx(i), y(v)])).filter(Boolean);
    if (pts.length) {
      const line = pts.map((p, j) => (j ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("");
      s += '<path class="area" d="' + line + "L" + pts[pts.length - 1][0].toFixed(1) + "," + y(0) + "L" + pts[0][0].toFixed(1) + "," + y(0) + 'Z"></path>';
      s += '<path class="ln" d="' + line + '"></path>';
      const last = pts[pts.length - 1];
      s += '<circle class="dotm" cx="' + last[0] + '" cy="' + last[1] + '" r="5"></circle>';
      s += '<text class="lbl" x="' + (last[0] + 8) + '" y="' + last[1] + '" dy="4">' + known[known.length - 1] + "</text>";
    }
    s += xLabels(keys, ml, band).replaceAll("__Y__", H - 6);
    wrap.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="在庫数の推移のグラフ">' + s + "</svg>";
    const u = unit ? esc(unit) : "";
    attachHover(wrap, wrap.querySelector("svg"), W, ml, band, n, (i) =>
      "<b>" + dLabel(keys[i], true) + "</b><br>" + (vals[i] == null ? "記録なし" : "在庫 " + vals[i] + u));
  }

  function renderHist() {
    if (state.view !== "hist") return;
    const nDays = state.hDays;
    document.querySelectorAll("#hDays button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.days) === nDays)));
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const keys = [];
    for (let i = nDays - 1; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); keys.push(dk(d)); }
    const first = keys[0];

    // item choices: current items, plus deleted ones that still have records
    const names = new Map();
    state.items.forEach((i) => names.set(i.id, i.name || "（名称なし）"));
    state.hist.forEach((h) => { if (!names.has(h.itemId)) names.set(h.itemId, (h.name || "（名称なし）") + "（削除済み）"); });
    const opts = [...names].sort((a, b) => a[1].localeCompare(b[1], "ja"));
    if (state.hItem && !names.has(state.hItem)) state.hItem = "";
    $("hItem").replaceChildren(el("option", { value: "" }, "すべての品目"), ...opts.map(([id, nm]) => el("option", { value: id }, nm)));
    $("hItem").value = state.hItem;

    const single = state.hItem || null;
    const item = single ? state.items.find((i) => i.id === single) : null;
    const rows = state.hist.filter((h) => h.date >= first && (!single || h.itemId === single));
    const unit = single ? (item ? item.unit : (rows[0] && rows[0].unit)) || "" : "";
    const map = new Map(keys.map((k) => [k, { inc: 0, dec: 0, end: null, at: 0 }]));
    rows.forEach((h) => {
      const b = map.get(h.date); if (!b) return;
      b.inc += num(h.inc); b.dec += num(h.dec);
      if (num(h.at) > b.at) { b.at = num(h.at); b.end = num(h.endQty); }
    });
    const days = keys.map((k) => map.get(k));
    const tInc = days.reduce((a, d) => a + d.inc, 0), tDec = days.reduce((a, d) => a + d.dec, 0);
    const net = tInc - tDec;
    const u = unit ? el("span", { class: "u" }, unit) : null;
    const tile = (k, v, cls) => el("div", { class: "tile" + (cls ? " " + cls : "") }, el("span", { class: "k" }, k), el("span", { class: "v" }, String(v), u ? u.cloneNode(true) : null));
    const tiles = [
      tile("増えた", "+" + tInc),
      tile("減った", "−" + tDec),
      tile("差し引き", (net > 0 ? "+" : net < 0 ? "−" : "±") + Math.abs(net)),
    ];
    if (item) tiles.push(tile("いまの数", qtyOf(item)));
    $("hSum").replaceChildren(...tiles);

    $("hBarsTitle").textContent = single ? "「" + (names.get(single) || "") + "」の日ごとの増減" : "日ごとの増減（すべての品目の合計）";
    if (!rows.length) {
      $("hBars").replaceChildren(el("div", { class: "empty" },
        el("strong", {}, "この期間の記録はまだありません"),
        el("span", {}, "在庫の数を変えると、その日の「増えた・減った」がここにたまっていきます。記録はこの画面を追加した日から始まります。")));
    } else drawBars($("hBars"), keys, days, unit, !!single);

    // stock level line for one item
    $("hLinePanel").hidden = !single || !rows.length;
    if (single && rows.length) {
      const vals = []; let last = null;
      days.forEach((d) => { if (d.end != null) last = d.end; vals.push(last); });
      if (item) vals[vals.length - 1] = qtyOf(item);
      drawLine($("hLine"), keys, vals, item ? num(item.min) : 0, unit);
    }

    // table
    const tbl = $("hTbl");
    if (!rows.length) { $("hTblTitle").textContent = single ? "日ごとの記録" : "品目ごとの増減"; tbl.replaceChildren(el("p", { class: "note" }, "記録がたまると、ここに表で表示されます。")); return; }
    const td = (v, unitTxt) => el("td", {}, String(v), unitTxt ? el("span", { class: "unit" }, unitTxt) : null);
    if (single) {
      $("hTblTitle").textContent = "日ごとの記録";
      const body = keys.map((k, i) => [k, days[i]]).filter(([, d]) => d.inc || d.dec).reverse()
        .map(([k, d]) => el("tr", {}, el("td", {}, dLabel(k, true)), td(d.inc ? "+" + d.inc : "0"), td(d.dec ? "−" + d.dec : "0"), td(d.end == null ? "–" : d.end, unit)));
      tbl.replaceChildren(el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "日付"), el("th", {}, "増えた"), el("th", {}, "減った"), el("th", {}, "その日の終わり"))),
        el("tbody", {}, ...body)));
    } else {
      $("hTblTitle").textContent = "品目ごとの増減（減った順）";
      const agg = new Map();
      rows.forEach((h) => {
        const a = agg.get(h.itemId) || { inc: 0, dec: 0, name: names.get(h.itemId) || h.name || "", unit: h.unit || "" };
        a.inc += num(h.inc); a.dec += num(h.dec); agg.set(h.itemId, a);
      });
      const list = [...agg].sort((a, b) => b[1].dec - a[1].dec || a[1].name.localeCompare(b[1].name, "ja"));
      const body = list.map(([id, a]) => {
        const it = state.items.find((i) => i.id === id);
        const un = it ? it.unit || "" : a.unit;
        const n2 = a.inc - a.dec;
        const nameCell = el("td", {}, el("button", { class: "edit", style: "background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font:inherit;text-align:left", onclick: () => { state.hItem = id; renderHist(); window.scrollTo({ top: 0 }); } }, a.name));
        return el("tr", {}, nameCell, td("+" + a.inc, un), td("−" + a.dec, un), td((n2 > 0 ? "+" : n2 < 0 ? "−" : "±") + Math.abs(n2), un), td(it ? qtyOf(it) : "–", it ? un : ""));
      });
      tbl.replaceChildren(el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "品目"), el("th", {}, "増えた"), el("th", {}, "減った"), el("th", {}, "差し引き"), el("th", {}, "いまの数"))),
        el("tbody", {}, ...body)),
        el("p", { class: "note", style: "margin-top:8px" }, "品名をタップすると、その品目のグラフに切り替わります。"));
    }
  }

  function setView(v) {
    state.view = v;
    $("viewList").hidden = v !== "list";
    $("viewHist").hidden = v !== "hist";
    $("tabList").setAttribute("aria-selected", String(v === "list"));
    $("tabHist").setAttribute("aria-selected", String(v === "hist"));
    if (v === "hist") renderHist();
  }

  async function del() {
    const b = $("delBtn");
    if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "本当に削除する"; return; }
    const it = state.editing; if (!it) return;
    try {
      await w(state.db.collection("items").doc(it.id).delete());
      toast("「" + it.name + "」を削除しました");
      closeForm();
    } catch (e) { writeFailed(e); }
  }

  async function loadSamples() {
    const t = Date.now();
    const samples = [
      { name: "トイレットペーパー（サンプル）", category: "日用品", qty: 12, unit: "ロール", min: 6, place: "倉庫 棚A" },
      { name: "ゴミ袋 45L（サンプル）", category: "日用品", qty: 2, unit: "袋", min: 3, place: "倉庫 棚A" },
      { name: "コピー用紙 A4（サンプル）", category: "事務用品", qty: 0, unit: "箱", min: 1, place: "事務所" },
      { name: "ボールペン 黒（サンプル）", category: "事務用品", qty: 25, unit: "本", min: 10, place: "事務所 引き出し" },
      { name: "ペットボトル水 500ml（サンプル）", category: "飲料", qty: 18, unit: "本", min: 24, place: "倉庫 床" },
    ];
    try {
      for (const s of samples) {
        const ref = state.db.collection("items").doc();
        await w(ref.set({ ...s, note: "", createdAt: t, ...stamp() }));
        logChange({ id: ref.id, name: s.name, unit: s.unit }, 0, s.qty);
      }
      toast("サンプルを5件追加しました。不要になったら各品目の「編集」から削除できます");
    } catch (e) { writeFailed(e); }
  }

  // ---------- this device: id and display name ----------
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  state.me = ls.get("zaiko.device");
  if (!state.me) { state.me = "d" + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); ls.set("zaiko.device", state.me); }
  state.myName = ls.get("zaiko.name") || "";
  $("meName").value = state.myName;
  const saveName = () => {
    state.myName = $("meName").value.trim().slice(0, 20);
    ls.set("zaiko.name", state.myName);
    toast(state.myName ? "名前を「" + state.myName + "」にしました" : "名前を消しました");
  };
  $("meSave").addEventListener("click", saveName);
  $("meName").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); saveName(); } });

  // ---------- events ----------
  document.querySelectorAll(".tile").forEach((t) => t.addEventListener("click", () => { state.filter = t.dataset.filter; render(); }));
  $("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("cat").addEventListener("change", (e) => { state.cat = e.target.value; render(); });
  $("addBtn").addEventListener("click", () => openForm(null));
  $("cancelBtn").addEventListener("click", closeForm);
  $("saveBtn").addEventListener("click", save);
  $("delBtn").addEventListener("click", del);
  $("form").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); save(); } });
  $("tabList").addEventListener("click", () => { location.hash = "list"; setView("list"); });
  $("tabHist").addEventListener("click", () => { location.hash = "history"; setView("hist"); });
  window.addEventListener("hashchange", () => setView(location.hash === "#history" ? "hist" : "list"));
  document.querySelectorAll("#hDays button").forEach((b) => b.addEventListener("click", () => { state.hDays = Number(b.dataset.days); renderHist(); }));
  $("hItem").addEventListener("change", (e) => { state.hItem = e.target.value; renderHist(); });
  let rz, lastW = window.innerWidth;
  window.addEventListener("resize", () => {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth; clearTimeout(rz); rz = setTimeout(renderHist, 150);
  });
  setView(location.hash === "#history" ? "hist" : "list");

  // ---------- boot ----------
  async function boot() {
    const cfg = window.FIREBASE_CONFIG;
    if (!window.firebase || !cfg || !cfg.projectId) {
      state.loaded = true; state.canWrite = false;
      setConn("err", "未設定");
      banner(window.firebase ? "まだデータベースの設定がされていません（firebase-config.js を設定してください）。" : "データベースに接続できません。通信状況を確認して開き直してください。");
      $("addBtn").hidden = true; render(); return;
    }
    firebase.initializeApp(cfg);
    const db = firebase.firestore();
    try { await db.enablePersistence({ synchronizeTabs: true }); } catch {}
    state.db = db;
    window.addEventListener("online", () => setConn("live", "リアルタイム同期中"));
    window.addEventListener("offline", () => setConn("err", "オフライン（つながると自動で反映）"));

    const loadTimer = setTimeout(() => {
      setConn("err", "接続待ち");
      if (!state.loaded) { state.loaded = true; render(); }
      banner(state.items.length ? "最新の状態を取得できていない可能性があります。" : "在庫データにまだ接続できません。通信状況を確認してください。");
    }, 10000);

    db.collection("items").onSnapshot((snap) => {
      state.items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      state.loaded = true;
      if (!snap.metadata.fromCache) {
        clearTimeout(loadTimer);
        setConn("live", "リアルタイム同期中");
        if ($("banner").textContent.startsWith("最新") || $("banner").textContent.startsWith("在庫データ")) banner("");
      }
      if (state.editing && !state.items.some((i) => i.id === state.editing.id)) closeForm();
      render();
      renderHist();
    }, (err) => {
      clearTimeout(loadTimer);
      state.loaded = true;
      setConn("err", "同期が止まりました");
      banner("同期が止まりました。ページを開き直してください。");
      render();
    });

    const since = dk(new Date(Date.now() - 95 * 864e5));
    db.collection("history").where("date", ">=", since).onSnapshot((snap) => {
      state.hist = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderHist();
    }, () => {});
  }
  boot();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
